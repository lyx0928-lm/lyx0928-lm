<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>在线评分</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h1>在线评分</h1>

  <form id="scoreForm" class="card" novalidate>
    <div class="small">
      评分项：备课(0-2)、上课(0-6)、听课(0-2)，均允许一位小数。<br/>
      提交要求：本次 2-5 人，且每个人 <b>总分必须都不一样</b>（用于排序），否则无法提交。<br/>
      提交后参与者 <b>看不到统计结果</b>。
    </div>

    <div class="row">
      <label for="evaluator">你的名字</label>
      <input id="evaluator" type="text" placeholder="例如：张三" required />
    </div>

    <div class="row">
      <label for="count">人数</label>
      <select id="count">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5" selected>5</option>
      </select>
    </div>

    <div id="peopleWrap" class="peopleWrap"></div>

    <div class="actions">
      <button type="submit">提交</button>
      <button type="button" id="resetBtn">清空</button>
    </div>

    <div class="hint" id="msg" aria-live="polite"></div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js"></script>
</body>
</html>
